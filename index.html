<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Investimento</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: : linear-gradient(135deg, #0b1020, #24104f, #101b45);;
  color: white;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 25px 18px;
}

.header {
  background: linear-gradient(135deg, #3155ff, #7b35d8);
  padding: 28px 22px;
  border-radius: 22px;
  margin-bottom: 22px;
}

.header h1 {
  margin: 0 0 10px;
  font-size: 30px;
}

.header p {
  margin: 0;
  color: #e5e7ff;
}

.card {
  background: #151c32;
  border: 1px solid #293454;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 16px;
}

.card h2 {
  margin-top: 0;
  font-size: 20px;
}

.valor {
  font-size: 30px;
  font-weight: bold;
  margin: 12px 0;
}

.info {
  color: #aeb8d4;
  font-size: 14px;
}

.buttons {
  display: flex;
  gap: 12px;
  margin-top: 18px;
}

button {
  flex: 1;
  border: none;
  padding: 14px;
  border-radius: 12px;
  font-size: 16px;
  font-weight: bold;
  color: white;
  background: #3155ff;
}

button.secundario {
  background: #242e4b;
}

.footer {
  text-align: center;
  color: #7f8baa;
  font-size: 13px;
  margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Meu Investimento</h1>
    <p>Seu espaço para acompanhar seus investimentos.</p>
  </div>

  <div class="card">
    <h2>Resumo dos investimentos</h2>
    <div class="valor">MZN 0,00</div>
    <div class="info">Saldo demonstrativo</div>

    <div class="buttons">
      <button>Adicionar</button>
      <button class="secundario">Detalhes</button>
    </div>
  </div>

  <div class="card">
    <h2>Meu progresso</h2>
    <p class="info">Acompanhe seus valores e organize seus investimentos em um só lugar.</p>
  </div>

  <div class="footer">
    Meu Investimento • Painel pessoal
  </div>

</div>

</body>
</html>
